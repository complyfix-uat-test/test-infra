AWSTemplateFormatVersion: '2010-09-09'
Description: 'MedVault Compute Tier - ALB, ECS, Lambda, ECR - CloudFormation Template'

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  ImageUri:
    Type: String
    Default: 123456789012.dkr.ecr.us-east-1.amazonaws.com/medvault-app:latest
    Description: Docker image URI for ECS task

  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: Desired number of ECS tasks

  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for HTTPS listener (optional)

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  # ECR Repository
  MedVaultECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub 'medvault-app-${Environment}'
      ImageScanningConfiguration:
        ScanOnPush: false
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Name
          Value: !Sub 'medvault-ecr-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MedVault
        - Key: Compliance
          Value: HIPAA
        - Key: ManagedBy
          Value: CloudFormation

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'medvault-alb-${Environment}'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Select
          - 0
          - !Split
            - ','
            - !ImportValue
              Fn::Sub: 'MedVault-PublicSubnets-${Environment}'
        - !Select
          - 1
          - !Split
            - ','
            - !ImportValue
              Fn::Sub: 'MedVault-PublicSubnets-${Environment}'
      SecurityGroups:
        - !ImportValue
          Fn::Sub: 'MedVault-ALBSG-${Environment}'
      LoadBalancerAttributes:
        - Key: idle_timeout.connection.timeout
          Value: '60'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: !Sub 'medvault-alb-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MedVault
        - Key: ManagedBy
          Value: CloudFormation

  # Target Group
  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'medvault-tg-${Environment}'
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !ImportValue
        Fn::Sub: 'MedVault-VPC-ID-${Environment}'
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200-299'
      Tags:
        - Key: Name
          Value: !Sub 'medvault-tg-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MedVault
        - Key: ManagedBy
          Value: CloudFormation

  # VIOLATION: ALB Listener - HTTP only (pattern 17)
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup

  # Conditional HTTPS Listener (not created by default because HasCertificate is false)
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup

  # ECS Cluster
  MedVaultCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub 'medvault-cluster-${Environment}'
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: Name
          Value: !Sub 'medvault-cluster-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MedVault
        - Key: ManagedBy
          Value: CloudFormation

  # ECS Cluster Capacity Providers
  ClusterCapacityProviderAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociation
    Properties:
      Cluster: !Ref MedVaultCluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 1

  # ECS Task Execution Role
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub 'medvault-ecs-exec-role-${Environment}'
        - Key: Project
          Value: MedVault
        - Key: ManagedBy
          Value: CloudFormation

  # VIOLATION: ECS Task Role with overly permissive policy (pattern 11)
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: ApplicationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: '*'
                Sid: 'VIOLATION: Overly permissive policy'
      Tags:
        - Key: Name
          Value: !Sub 'medvault-ecs-task-role-${Environment}'
        - Key: Project
          Value: MedVault
        - Key: ManagedBy
          Value: CloudFormation

  # ECS Task Definition
  MedVaultTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'medvault-app-${Environment}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: medvault-app
          Image: !Ref ImageUri
          Cpu: 512
          Memory: 1024
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: LOG_LEVEL
              Value: INFO
      Tags:
        - Key: Name
          Value: !Sub 'medvault-task-def-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MedVault
        - Key: ManagedBy
          Value: CloudFormation

  # ECS Service
  MedVaultService:
    Type: AWS::ECS::Service
    DependsOn: HTTPListener
    Properties:
      ServiceName: !Sub 'medvault-service-${Environment}'
      Cluster: !Ref MedVaultCluster
      TaskDefinition: !Ref MedVaultTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Select
              - 0
              - !Split
                - ','
                - !ImportValue
                  Fn::Sub: 'MedVault-PrivateSubnets-${Environment}'
            - !Select
              - 1
              - !Split
                - ','
                - !ImportValue
                  Fn::Sub: 'MedVault-PrivateSubnets-${Environment}'
          SecurityGroups:
            - !ImportValue
              Fn::Sub: 'MedVault-AppSG-${Environment}'
      LoadBalancers:
        - ContainerName: medvault-app
          ContainerPort: 8080
          TargetGroupArn: !Ref ApplicationTargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      Tags:
        - Key: Name
          Value: !Sub 'medvault-service-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MedVault
        - Key: ManagedBy
          Value: CloudFormation

  # Application CloudWatch Log Group
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/medvault/ecs/${Environment}'
      RetentionInDays: 7

  # VIOLATION: Lambda function without VPC config (pattern 25)
  DataProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medvault-data-processor-${Environment}'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 512
      ReservedConcurrentExecutions: 10
      Code:
        ZipFile: |
          import json
          import boto3
          import base64

          s3_client = boto3.client('s3')
          dynamodb = boto3.resource('dynamodb')

          def handler(event, context):
              """Process PHI data from S3"""
              try:
                  bucket = event['bucket']
                  key = event['key']

                  # Read from S3
                  response = s3_client.get_object(Bucket=bucket, Key=key)
                  data = json.loads(response['Body'].read())

                  # Process data
                  processed = process_phi_data(data)

                  return {
                      'statusCode': 200,
                      'body': json.dumps({'processed': processed})
                  }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }

          def process_phi_data(data):
              """Process sensitive health information"""
              return {'records': len(data)}
      Tags:
        - Key: Name
          Value: !Sub 'medvault-data-processor-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MedVault
        - Key: Compliance
          Value: HIPAA
        - Key: ManagedBy
          Value: CloudFormation

  # VIOLATION: Lambda function without VPC config (pattern 25)
  NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medvault-notification-${Environment}'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import json
          import boto3

          sns_client = boto3.client('sns')

          def handler(event, context):
              """Send notifications"""
              try:
                  topic_arn = event['topic_arn']
                  message = event['message']

                  response = sns_client.publish(
                      TopicArn=topic_arn,
                      Subject='MedVault Alert',
                      Message=message
                  )

                  return {
                      'statusCode': 200,
                      'body': json.dumps({'messageId': response['MessageId']})
                  }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }
      Tags:
        - Key: Name
          Value: !Sub 'medvault-notification-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MedVault
        - Key: ManagedBy
          Value: CloudFormation

  # Lambda function with VPC config (compliant - shows mixed compliance)
  AuditLogFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medvault-audit-log-${Environment}'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: 'MedVault-AppSG-${Environment}'
        SubnetIds:
          - !Select
            - 0
            - !Split
              - ','
              - !ImportValue
                Fn::Sub: 'MedVault-PrivateSubnets-${Environment}'
          - !Select
            - 1
            - !Split
              - ','
              - !ImportValue
                Fn::Sub: 'MedVault-PrivateSubnets-${Environment}'
      Code:
        ZipFile: |
          import json
          import boto3
          from datetime import datetime

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table('medvault-audit-trail-staging')

          def handler(event, context):
              """Write audit logs"""
              try:
                  audit_entry = {
                      'AuditId': event['audit_id'],
                      'Timestamp': int(datetime.now().timestamp() * 1000),
                      'Action': event['action'],
                      'UserId': event['user_id'],
                      'Resource': event['resource'],
                      'Status': event['status']
                  }

                  table.put_item(Item=audit_entry)

                  return {
                      'statusCode': 200,
                      'body': json.dumps({'success': True})
                  }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': str(e)})
                  }
      Tags:
        - Key: Name
          Value: !Sub 'medvault-audit-log-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: AuditLogs
        - Key: Project
          Value: MedVault
        - Key: Compliance
          Value: HIPAA
        - Key: ManagedBy
          Value: CloudFormation

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 's3:*'
                Resource: '*'
                Sid: 'VIOLATION: Overly broad S3 permissions (pattern 11)'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'dynamodb:PutItem'
                  - 'dynamodb:GetItem'
                  - 'dynamodb:Query'
                Resource: '*'
        - PolicyName: SNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sns:Publish'
                Resource: '*'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: 'arn:aws:logs:*:*:*'
      Tags:
        - Key: Name
          Value: !Sub 'medvault-lambda-exec-role-${Environment}'
        - Key: Project
          Value: MedVault
        - Key: ManagedBy
          Value: CloudFormation

  # Nested Stack Reference (ComplyFix logs warning, doesn't resolve)
  NetworkingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      StackName: !Sub 'medvault-networking-${Environment}'
      TemplateURL: !Sub 'https://s3.amazonaws.com/medvault-cf-templates/networking-${Environment}.yaml'
      Parameters:
        Environment: !Ref Environment
      Tags:
        - Key: Name
          Value: !Sub 'medvault-networking-stack-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: MedVault
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  LoadBalancerDNS:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub 'MedVault-ALB-DNS-${Environment}'

  LoadBalancerArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref ApplicationLoadBalancer

  TargetGroupArn:
    Description: ARN of the target group
    Value: !Ref ApplicationTargetGroup

  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref MedVaultCluster

  ECSServiceName:
    Description: ECS service name
    Value: !GetAtt MedVaultService.Name

  ECRRepositoryUri:
    Description: ECR repository URI
    Value: !GetAtt MedVaultECRRepository.RepositoryUri

  DataProcessorFunctionArn:
    Description: Data Processor Lambda function ARN
    Value: !GetAtt DataProcessorFunction.Arn

  NotificationFunctionArn:
    Description: Notification Lambda function ARN
    Value: !GetAtt NotificationFunction.Arn

  AuditLogFunctionArn:
    Description: Audit Log Lambda function ARN
    Value: !GetAtt AuditLogFunction.Arn

  ApplicationLogGroup:
    Description: CloudWatch log group for application
    Value: !Ref ApplicationLogGroup
