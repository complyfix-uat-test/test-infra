{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "internal-tools.fullname" . }}
  labels:
    {{- include "internal-tools.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "internal-tools.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  {{- else }}
  ingress:
    - from:
      - podSelector:
          matchLabels:
            role: admin
  {{- end }}
  {{- if .Values.networkPolicy.egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- else }}
  egress:
    - to:
      - namespaceSelector: {}
  {{- end }}
{{- end }}
