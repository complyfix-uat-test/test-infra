apiVersion: v2
name: patient-api
description: Patient Data API microservice for MedVault. Handles PHI data with compliance requirements for SOC 2 and HIPAA.
type: application
version: 1.4.0
appVersion: "2.3.1"
keywords:
  - healthcare
  - phi
  - microservice
  - api
  - patient-data
home: https://github.com/medvault/patient-api
sources:
  - https://github.com/medvault/patient-api
maintainers:
  - name: MedVault Platform Team
    email: platform@medvault.io
  - name: DevOps
    email: devops@medvault.io
icon: https://medvault.io/logo.png
dependencies:
  - name: common
    version: "0.2.0"
    repository: "file://../common"
    alias: common
  - name: redis
    version: "17.11.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "12.1.2"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
