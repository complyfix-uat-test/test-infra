apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "patient-api.fullname" . }}-config
  labels:
    {{- include "patient-api.labels" . | nindent 4 }}
data:
  application.yaml: |
    server:
      port: {{ .Values.config.port }}
      servlet:
        context-path: /
    logging:
      level: {{ .Values.config.logLevel }}
      format: json
    application:
      name: patient-api
      environment: {{ .Values.config.environment }}
      version: {{ .Chart.AppVersion }}
    compliance:
      piiHandling: true
      auditLogging: {{ .Values.config.auditLogging | default "false" }}
      frameworks:
        - HIPAA
        - SOC2
    database:
      name: {{ .Values.postgresql.auth.database }}
      pool:
        max-size: 20
        min-size: 5
    redis:
      ttl: 3600
      codec: json
    security:
      jwt:
        enabled: true
        algorithm: RS256
  database.name: {{ .Values.postgresql.auth.database }}
  redis.host: "{{ .Release.Name }}-redis-master"
  redis.port: "6379"
